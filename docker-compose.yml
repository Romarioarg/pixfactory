services:
  mysql:
    image: mysql:8.4
    container_name: pixfactory-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pixfactory
      MYSQL_USER: pixfactory
      MYSQL_PASSWORD: pixfactory
      MYSQL_ROOT_PASSWORD: pixfactory-root
    ports:
      - "3306:3306"
    volumes:
      - pixfactory_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-upixfactory", "-ppixfactory"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: pixfactory-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pixfactory?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: pixfactory
      SPRING_DATASOURCE_PASSWORD: pixfactory
      JWT_SECRET: pixfactory-demo-secret-change-me-please-32chars!!
      PIXFACTORY_SEED: "true"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8080:8080"

volumes:
  pixfactory_mysql:
