spring.application.name=pixfactory
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pixfactory?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pixfactory}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pixfactory}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

pixfactory.jwt.secret=${JWT_SECRET:pixfactory-demo-secret-change-me-please-32chars!!}
pixfactory.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
pixfactory.cors.origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500}
pixfactory.frontend-dir=${FRONTEND_DIR:../frontend}
pixfactory.seed=${PIXFACTORY_SEED:true}

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
