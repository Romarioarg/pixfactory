name: Smoke Tests

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/smoke/package-lock.json

      - name: Start PixFactory
        run: docker compose -p pixfactory up --build -d

      - name: Wait for API login
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/pf-login.json -w "%{http_code}" \
              -X POST "http://127.0.0.1:8080/api/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"demo@pixfactory.app","password":"Demo@123"}' || true)
            if grep -q '"token"' /tmp/pf-login.json 2>/dev/null; then
              echo "API login is ready (HTTP $code)"
              exit 0
            fi
            echo "Waiting for demo login ($i) HTTP ${code:-000}"
            sleep 5
          done
          echo "Demo login did not become ready"
          docker compose -p pixfactory logs
          exit 1

      - name: Install Playwright
        working-directory: tests/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run smoke suite
        working-directory: tests/smoke
        env:
          BASE_URL: http://127.0.0.1:8080
          CI: "true"
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: tests/smoke/playwright-report/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose -p pixfactory down
