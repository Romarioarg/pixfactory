<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar perfil | PixFactory</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="main-content" id="main">
    <header class="page-header"><h1>Editar perfil</h1></header>
    <p>Papel: <strong id="role"></strong> · Plano: <strong id="plan"></strong></p>
    <form id="profile-form" class="card stack">
      <div class="field"><label for="nome">Nome</label><input id="nome" required></div>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" required></div>
      <div class="field"><label for="telefone">Telefone</label><input id="telefone"></div>
      <div class="field"><label for="endereco">Endereço</label><textarea id="endereco"></textarea></div>
      <div class="actions-row"><button type="submit">Salvar</button><a class="btn btn-secondary" href="perfil.html">Voltar</a></div>
    </form>
    <section id="admin-box" hidden></section>
  </main>
  <script src="js/format.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/perfil.js"></script>
</body>
</html>
