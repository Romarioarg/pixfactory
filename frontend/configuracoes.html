<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações | PixFactory</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="main-content" id="main">
    <header class="page-header"><h1>Configurações</h1></header>
    <div class="grid grid-2">
      <form id="settings-form" class="card stack">
        <h2>Geral</h2>
        <div class="field"><label for="companyName">Nome da empresa</label><input id="companyName"></div>
        <div class="field"><label for="slogan">Slogan</label><input id="slogan"></div>
        <div class="field"><label for="defaultInterestRate">Juros padrão (%)</label><input id="defaultInterestRate" type="number" step="0.01"></div>
        <div class="field"><label for="lateFeePercent">Multa de atraso (%)</label><input id="lateFeePercent" type="number" step="0.01" min="0"></div>
        <div class="field"><label for="moraPercentPerDay">Juros de mora ao dia (%)</label><input id="moraPercentPerDay" type="number" step="0.001" min="0"></div>
        <div class="field"><label for="earlyPayoffDiscountPercent">Desconto quitação antecipada (%)</label><input id="earlyPayoffDiscountPercent" type="number" step="0.01" min="0"></div>
        <div class="field"><label for="graceDays">Carência (dias)</label><input id="graceDays" type="number" min="0"></div>
        <label><input id="emailNotifications" type="checkbox"> Notificações por e-mail (preferência local)</label>
        <label><input id="paymentReminders" type="checkbox"> Lembretes de pagamento</label>
        <button type="submit">Salvar</button>
      </form>
      <form id="password-form" class="card stack">
        <h2>Segurança</h2>
        <div class="field"><label for="current-password">Senha atual</label><input id="current-password" type="password" required></div>
        <div class="field"><label for="next-password">Nova senha</label><input id="next-password" type="password" required></div>
        <div class="field"><label for="next-password-2">Confirmar</label><input id="next-password-2" type="password" required></div>
        <button type="submit">Alterar senha</button>
        <hr>
        <button type="button" id="reset-demo" class="btn-danger">Restaurar dados de demonstração</button>
      </form>
    </div>
  </main>
  <script src="js/format.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/configuracoes.js"></script>
</body>
</html>
