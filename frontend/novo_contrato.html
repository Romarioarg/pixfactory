<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo contrato | PixFactory</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="main-content" id="main">
    <header class="page-header"><h1>Novo contrato</h1></header>
    <div class="grid grid-2">
      <form id="novo-contrato-form" class="card stack">
        <div class="field"><label for="cliente">Cliente</label><select id="cliente" required></select></div>
        <div class="field"><label for="tipo">Tipo</label>
          <select id="tipo"><option>Empréstimo</option><option>Financiamento</option><option>Serviço</option></select>
        </div>
        <div class="field"><label for="valor">Valor</label><input id="valor" type="number" min="1" step="0.01" required></div>
        <div class="field"><label for="juros">Juros mensal (%)</label><input id="juros" type="number" min="0" step="0.01" value="2.5"></div>
        <div class="field"><label for="parcelas">Parcelas</label><input id="parcelas" type="number" min="1" value="6" required></div>
        <div class="field"><label for="vencimento">Primeiro vencimento</label><input id="vencimento" type="date"></div>
        <div class="field"><label for="clausulas">Cláusulas</label><textarea id="clausulas" rows="4">Em caso de atraso, aplicam-se juros e multa conforme combinado.</textarea></div>
        <div class="actions-row"><button type="submit">Salvar contrato</button><button type="button" id="print-contract" class="btn-ghost">Imprimir prévia</button></div>
      </form>
      <aside class="card" id="contrato-preview"></aside>
    </div>
  </main>
  <script src="js/format.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/novo-contrato.js"></script>
</body>
</html>
