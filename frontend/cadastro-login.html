<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | PixFactory</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth">
  <main class="auth-card">
    <h1>Criar conta</h1>
    <form id="register-form">
      <div class="field"><label for="name">Nome completo</label><input id="name" required><p class="field-error" data-error-for="name"></p></div>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" required><p class="field-error" data-error-for="email"></p></div>
      <div class="field"><label for="phone">Telefone (opcional)</label><input id="phone" type="tel"><p class="field-error" data-error-for="phone"></p></div>
      <div class="field"><label for="password">Senha</label><input id="password" type="password" required><button type="button" class="btn-ghost" data-toggle-password="password">Mostrar</button><p class="field-error" data-error-for="password"></p></div>
      <div class="field"><label for="confirm-password">Confirmar senha</label><input id="confirm-password" type="password" required><p class="field-error" data-error-for="confirm"></p></div>
      <button type="submit" style="width:100%">Criar conta</button>
    </form>
    <p><a href="index.html">Já tem conta? Entrar</a></p>
  </main>
  <script src="js/format.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
