<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar cliente | PixFactory</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="main-content" id="main">
    <div id="edit-root">
      <header class="page-header"><h1>Editar cliente</h1></header>
      <form id="edit-form" class="card stack">
        <div class="field"><label for="nome">Nome</label><input id="nome" required><p class="field-error" data-error-for="nome"></p></div>
        <div class="field"><label for="cpf">CPF</label><input id="cpf" required><p class="field-error" data-error-for="cpf"></p></div>
        <div class="field"><label for="telefone">Telefone</label><input id="telefone" required><p class="field-error" data-error-for="telefone"></p></div>
        <div class="field"><label for="email">E-mail</label><input id="email" type="email" required><p class="field-error" data-error-for="email"></p></div>
        <div class="field"><label for="dataNascimento">Nascimento</label><input id="dataNascimento" type="date"></div>
        <div class="field"><label for="endereco">Endereço</label><textarea id="endereco"></textarea></div>
        <div class="field"><label for="profissao">Profissão</label><input id="profissao"></div>
        <div class="field"><label for="rendaMensal">Renda</label><input id="rendaMensal" type="number" step="0.01"></div>
        <div class="field"><label for="banco">Banco</label><input id="banco"></div>
        <div class="field"><label for="classificacao">Classificação</label>
          <select id="classificacao"><option>Bom pagador</option><option>Médio</option><option>Ruim</option></select>
        </div>
        <h3>Indicador</h3>
        <p class="hint">Quem indicou. Não é avalista.</p>
        <div class="field"><label for="indicador-nome">Nome</label><input id="indicador-nome"></div>
        <div class="field"><label for="indicador-telefone">Telefone</label><input id="indicador-telefone"></div>
        <div class="field"><label for="indicador-endereco">Endereço</label><input id="indicador-endereco"></div>
        <div class="field"><label for="indicador-relacao">Relação</label><input id="indicador-relacao"></div>
        <div class="field"><label for="indicador-obs">Observação</label><textarea id="indicador-obs" rows="2"></textarea></div>
        <h3>Referências</h3>
        <div class="field"><label for="ref1-nome">Referência 1</label><input id="ref1-nome"></div>
        <div class="field"><label for="ref1-telefone">Telefone</label><input id="ref1-telefone"></div>
        <div class="field"><label for="ref1-relacao">Relação</label><input id="ref1-relacao"></div>
        <div class="actions-row"><button type="submit">Salvar</button><a class="btn btn-secondary" href="clientes.html">Voltar</a></div>
      </form>
    </div>
  </main>
  <script src="js/format.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/editar-cliente.js"></script>
</body>
</html>
