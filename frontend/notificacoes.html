<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações | PixFactory</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="main-content" id="main">
    <header class="page-header">
      <h1>Notificações</h1>
      <div class="actions-row">
        <button type="button" id="mark-all" class="btn-ghost">Marcar todas como lidas</button>
        <button type="button" id="clear-all" class="btn-danger">Limpar</button>
        <button type="button" id="enable-push">Ativar no navegador</button>
      </div>
    </header>
    <input class="search-input" id="notif-search" type="search" placeholder="Buscar notificações">
    <div id="notif-list"></div>
  </main>
  <script src="js/format.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/notificacoes.js"></script>
</body>
</html>
