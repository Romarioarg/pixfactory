<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexão bancária | PixFactory</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="main-content" id="main">
    <div id="banner"></div>
    <div id="fin-nav"></div>
    <header class="page-header"><h1>Conexão bancária</h1><button type="button" id="open-bank">Conectar banco</button></header>
    <p class="hint">Simulação local de Open Finance. Nenhum dado bancário real é enviado.</p>
    <div id="bank-list"></div>
  </main>
  <div id="bank-modal" class="modal"><div class="modal-content">
    <button class="modal-close" type="button" data-close-modal="bank-modal" aria-label="Fechar">&times;</button>
    <h3>Conectar banco</h3>
    <form id="bank-form" class="stack">
      <div class="field"><label for="bank-nome">Banco</label><input id="bank-nome" required></div>
      <div class="field"><label for="bank-ag">Agência</label><input id="bank-ag"></div>
      <div class="field"><label for="bank-cc">Conta</label><input id="bank-cc"></div>
      <button type="submit">Salvar</button>
    </form>
  </div></div>
  <script src="js/format.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/bancos.js"></script>
</body>
</html>
