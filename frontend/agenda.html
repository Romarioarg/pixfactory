<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda | PixFactory</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="main-content" id="main">
    <header class="page-header">
      <h1>Agenda de cobranças</h1>
      <div class="actions-row">
        <button type="button" id="prev-month" class="btn-ghost">Anterior</button>
        <strong id="month-year"></strong>
        <button type="button" id="next-month" class="btn-ghost">Próximo</button>
      </div>
    </header>
    <div class="calendar" id="calendar-grid"></div>
    <section class="card" style="margin-top:16px" id="day-details"></section>
  </main>
  <script src="js/format.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/agenda.js"></script>
</body>
</html>
