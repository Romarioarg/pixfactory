<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limites | PixFactory</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="main-content" id="main">
    <div id="banner"></div>
    <div id="fin-nav"></div>
    <header class="page-header"><h1>Limite de gastos</h1><button type="button" id="open-limit">Novo limite</button></header>
    <div id="budget-list"></div>
  </main>
  <div id="limit-modal" class="modal"><div class="modal-content">
    <button class="modal-close" type="button" data-close-modal="limit-modal" aria-label="Fechar">&times;</button>
    <h3>Novo limite</h3>
    <form id="limit-form" class="stack">
      <div class="field"><label for="limit-cat">Categoria</label><input id="limit-cat" required></div>
      <div class="field"><label for="limit-val">Limite</label><input id="limit-val" type="number" min="1" step="0.01" required></div>
      <div class="field"><label for="limit-gasto">Já gasto</label><input id="limit-gasto" type="number" min="0" step="0.01"></div>
      <button type="submit">Salvar</button>
    </form>
  </div></div>
  <script src="js/format.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/limites.js"></script>
</body>
</html>
